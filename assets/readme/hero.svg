<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="ecpTitle ecpDesc">
  <title id="ecpTitle">everyone-can-projects 一条命令生成完整项目骨架</title>
  <desc id="ecpDesc">终端窗口显示 scaffold 命令创建 12 个文件，validate 命令 5 项检查全部通过，右侧为生成的目录结构。</desc>

  <style>
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Courier New', monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>

  <!-- 底卡片 -->
  <rect x="0" y="0" width="1200" height="500" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- 标题 + 光标 -->
  <text x="52" y="80" class="sans" font-size="40" font-weight="700" fill="#e6edf3">everyone-can-projects</text>
  <rect x="556" y="48" width="22" height="42" rx="3" fill="#3fb950"/>
  <text x="52" y="120" class="sans" font-size="23" fill="#8b949e">输入一段需求说明，生成带立项文档、门禁检查和进度记录的项目目录</text>

  <!-- 终端窗口 -->
  <rect x="52" y="152" width="1096" height="316" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="84" cy="186" r="7" fill="#f85149"/>
  <circle cx="108" cy="186" r="7" fill="#d29922"/>
  <circle cx="132" cy="186" r="7" fill="#3fb950"/>
  <text x="600" y="193" text-anchor="middle" class="mono" font-size="16" fill="#8b949e">terminal</text>
  <line x1="52" y1="212" x2="1148" y2="212" stroke="#30363d" stroke-width="1"/>

  <!-- 左：命令会话 -->
  <text x="88" y="258" class="mono" font-size="22"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3" xml:space="preserve"> scaffold --name my-site --brief "个人网站"</tspan></text>
  <text x="88" y="302" class="mono" font-size="20" fill="#8b949e">创建：12 项 — 7 份立项文档 · phases/ · PROGRESS.md</text>
  <text x="88" y="358" class="mono" font-size="22"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3" xml:space="preserve"> validate ../workspace/my-site</tspan></text>
  <text x="88" y="402" class="mono" font-size="22" fill="#3fb950">校验 PASS · 5/5 项检查通过</text>

  <!-- 分隔线 -->
  <line x1="712" y1="236" x2="712" y2="420" stroke="#21262d" stroke-width="1"/>

  <!-- 右：生成结果 -->
  <text x="744" y="258" class="mono" font-size="22" font-weight="700" fill="#58a6ff">my-site/</text>
  <text x="744" y="302" class="mono" font-size="22"><tspan fill="#58a6ff">├─ docs/planning/</tspan><tspan fill="#8b949e" font-size="20" xml:space="preserve"> 7 份立项文档</tspan></text>
  <text x="744" y="346" class="mono" font-size="22"><tspan fill="#58a6ff">├─ phases/</tspan><tspan fill="#8b949e" font-size="20" xml:space="preserve"> 4 份交接文件</tspan></text>
  <text x="744" y="390" class="mono" font-size="22"><tspan fill="#e6edf3">└─ PROGRESS.md</tspan><tspan fill="#8b949e" font-size="20" xml:space="preserve"> 进度记录</tspan></text>
</svg>
